<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
    <title>Немає з'єднання — Freecora CRM</title>
    <style>
        :root { color-scheme: light dark; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #eef2ff 0%, #ffffff 60%);
            color: #1f2937;
            user-select: none;
            cursor: default;
        }

        .card { width: 100%; max-width: 400px; text-align: center; }

        .badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: block;
            filter: drop-shadow(0 6px 16px rgba(79, 70, 229, 0.28));
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 24px;
            font-size: 0.95rem;
            line-height: 1.55;
            color: #6b7280;
        }

        .host {
            display: inline-block;
            margin-bottom: 24px;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(79, 70, 229, 0.08);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.8rem;
            color: #4338ca;
            user-select: text;
        }

        .actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        button {
            appearance: none;
            border: none;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
            transition: opacity 0.15s ease;
        }

        button:hover { opacity: 0.92; }
        button:active { opacity: 0.82; }

        .link {
            appearance: none;
            border: none;
            background: none;
            padding: 0;
            box-shadow: none;
            cursor: pointer;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4f46e5;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        footer {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            font-size: 0.72rem;
            color: #9ca3af;
            text-align: center;
        }

        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(180deg, #0b1020 0%, #030712 60%); color: #f3f4f6; }
            p { color: #9ca3af; }
            .host { background: rgba(129, 140, 248, 0.14); color: #a5b4fc; }
            .link { color: #818cf8; }
            footer { color: #6b7280; }
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="badge" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <linearGradient id="freecora-badge" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#818CF8" />
                    <stop offset="0.55" stop-color="#4F46E5" />
                    <stop offset="1" stop-color="#4338CA" />
                </linearGradient>
            </defs>
            <rect width="48" height="48" rx="12" fill="url(#freecora-badge)" />
            <rect width="48" height="24" rx="12" fill="#fff" fill-opacity="0.08" />
            <rect x="15.5" y="13" width="5" height="22" rx="2.5" fill="#fff" />
            <rect x="15.5" y="13" width="17" height="5" rx="2.5" fill="#fff" />
            <rect x="15.5" y="21.5" width="12" height="5" rx="2.5" fill="#fff" />
            <path d="M27 33.5L30.5 29.5L33 32L37 26.5" stroke="#A5B4FC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="37.2" cy="26.4" r="1.9" fill="#C7D2FE" />
        </svg>

        <h1>Не вдалося підключитися</h1>
        <p>Freecora CRM працює онлайн, тож застосунку потрібне з'єднання з інтернетом. Перевірте підключення й спробуйте ще раз.</p>

        <div class="host" id="host">app.freecora.com</div>

        <div class="actions">
            <button type="button" id="retry">Спробувати ще раз</button>
            <button type="button" class="link" id="browser">Відкрити у браузері</button>
        </div>
    </div>

    <footer id="version"></footer>

    <script>
        const api = window.freecora;

        document.getElementById('retry').addEventListener('click', () => api.retry());
        document.getElementById('browser').addEventListener('click', () => api.openInBrowser());

        api.info()
            .then(({ version, host }) => {
                document.getElementById('host').textContent = host;
                document.getElementById('version').textContent =
                    `Freecora CRM · версія ${version} · Electron ${api.versions.electron}`;
            })
            .catch(() => {
                document.getElementById('version').textContent = `Electron ${api.versions.electron}`;
            });
    </script>
</body>
</html>
