<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;">
    <title>Freecora CRM</title>
    <style>
        :root { color-scheme: light dark; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #eef2ff 0%, #ffffff 60%);
            color: #1f2937;
            user-select: none;
            cursor: default;
        }

        .card { width: 100%; max-width: 320px; text-align: center; }

        .badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: block;
            filter: drop-shadow(0 6px 16px rgba(79, 70, 229, 0.28));
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 22px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #6b7280;
        }

        .track {
            height: 3px;
            width: 180px;
            margin: 0 auto;
            border-radius: 999px;
            background: rgba(79, 70, 229, 0.15);
            overflow: hidden;
        }

        .track span {
            display: block;
            height: 100%;
            width: 40%;
            border-radius: 999px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            animation: slide 1.4s ease-in-out infinite;
        }

        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .track span { animation: none; width: 100%; }
        }

        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(180deg, #0b1020 0%, #030712 60%); color: #f3f4f6; }
            p { color: #9ca3af; }
            .track { background: rgba(129, 140, 248, 0.18); }
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="badge" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <linearGradient id="freecora-badge" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#818CF8" />
                    <stop offset="0.55" stop-color="#4F46E5" />
                    <stop offset="1" stop-color="#4338CA" />
                </linearGradient>
            </defs>
            <rect width="48" height="48" rx="12" fill="url(#freecora-badge)" />
            <rect width="48" height="24" rx="12" fill="#fff" fill-opacity="0.08" />
            <rect x="15.5" y="13" width="5" height="22" rx="2.5" fill="#fff" />
            <rect x="15.5" y="13" width="17" height="5" rx="2.5" fill="#fff" />
            <rect x="15.5" y="21.5" width="12" height="5" rx="2.5" fill="#fff" />
            <path d="M27 33.5L30.5 29.5L33 32L37 26.5" stroke="#A5B4FC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="37.2" cy="26.4" r="1.9" fill="#C7D2FE" />
        </svg>

        <h1>Freecora CRM</h1>
        <p>Завантаження робочого простору…</p>

        <div class="track" role="progressbar" aria-label="Завантаження"><span></span></div>
    </div>
</body>
</html>
